apiVersion: apps/v1
kind: Deployment
metadata:
  name: contoso-angular
  namespace: contoso-apps
  labels:
    app: contoso-angular
spec:
  replicas: 2
  selector:
    matchLabels:
      app: contoso-angular
  template:
    metadata:
      labels:
        app: contoso-angular
    spec:
      automountServiceAccountToken: false
      containers:
      - name: contoso-angular
        image: ACR_NAME.azurecr.io/contosoangular:IMAGE_TAG
        ports:
        - containerPort: 80
        env:
        - name: WORKFLOW_URL
          value: "http://contoso-spa-api.LOAD_BALANCER_IP.nip.io" # NOSONAR DEV Only
        - name: CRUD_URL
          value: "http://contoso-api.LOAD_BALANCER_IP.nip.io" # NOSONAR DEV Only
        - name: GRID_URL
          value: "http://contoso-kendo-grid-api.LOAD_BALANCER_IP.nip.io" # NOSONAR DEV Only
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
            ephemeral-storage: "256Mi"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5